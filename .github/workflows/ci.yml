name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Record actual POSIX PGID0 inventory rows
        if: runner.os != 'Windows'
        run: |
          python -c "import subprocess,json; rows=subprocess.check_output(['ps','-axo','pid=,ppid=,pgid=,stat='],text=True).splitlines(); print(json.dumps({'inventoryRows':len(rows),'pgid0Rows':[r for r in rows if len(r.split())==4 and r.split()[2]=='0']}))"
      - run: pnpm test
      - run: node bin/kadmos.js test conformance/fixtures/order_settlement.world.yaml --runs 30
