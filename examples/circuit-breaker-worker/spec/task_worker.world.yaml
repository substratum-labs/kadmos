version: "kadmos.world.v0"
name: "TaskWorkerWorld"
description: "Circuit-breaking asynchronous task worker finite state machine"

states:
  - id: "IDLE"
    initial: true
  - id: "RUNNING"
  - id: "BACKOFF_WAIT"
  - id: "COMPLETED"
    terminal: true
  - id: "CIRCUIT_BROKEN"
    terminal: true

context:
  retry_count:
    type: integer
    unit: "count"
    min: 0
    max: 10
    default: 0
  max_retries:
    type: integer
    unit: "count"
    min: 1
    max: 10
    default: 3
  consecutive_failures:
    type: integer
    unit: "count"
    min: 0
    max: 10
    default: 0
  backoff_seconds:
    type: integer
    unit: "seconds"
    min: 0
    max: 3600
    default: 0

invariants:
  - id: "INV-01-RETRY-BOUND"
    description: "Retry count cannot exceed max retries"
    predicate: "retry_count <= max_retries"
  - id: "INV-02-NON-NEGATIVE"
    description: "Counters and durations cannot be negative"
    predicate: "retry_count >= 0 && consecutive_failures >= 0 && backoff_seconds >= 0"
  - id: "INV-03-CIRCUIT-BROKEN"
    description: "Circuit broken state must reach max retries"
    predicate: "state == 'CIRCUIT_BROKEN' => retry_count == max_retries"
  - id: "INV-04-COMPLETED-SAFETY"
    description: "Completed tasks have 0 consecutive failures"
    predicate: "state == 'COMPLETED' => consecutive_failures == 0"

transitions:
  - id: "START_TASK"
    from: "IDLE"
    to: "RUNNING"
    guard: true
    directive: "DISPATCH_EXECUTION_DISPATCHER"
    effects: []

  - id: "FINISH_SUCCESS"
    from: "RUNNING"
    to: "COMPLETED"
    guard: true
    directive: "RECORD_METRICS_AND_CLEANUP"
    effects:
      - "consecutive_failures = 0"
      - "backoff_seconds = 0"

  - id: "RECORD_FAILURE"
    from: "RUNNING"
    to: "BACKOFF_WAIT"
    guard: "retry_count < max_retries"
    directive: "SCHEDULE_TIMER_WAKEUP"
    effects:
      - "retry_count = retry_count + 1"
      - "consecutive_failures = consecutive_failures + 1"
      - "backoff_seconds = retry_count * 5"

  - id: "RETRY_TASK"
    from: "BACKOFF_WAIT"
    to: "RUNNING"
    guard: "retry_count <= max_retries"
    directive: "DISPATCH_EXECUTION_DISPATCHER"
    effects: []

  - id: "TRIP_CIRCUIT"
    from: "RUNNING"
    to: "CIRCUIT_BROKEN"
    guard: "retry_count == max_retries"
    directive: "TRIGGER_PAGER_ALERT"
    effects: []
